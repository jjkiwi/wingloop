[project]
name = "wingloop"
version = "0.1.0"
description = "A connectome-driven fly that flies: wing hinge, unsteady aerodynamics, and the descending neurons that steer it"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
body = ["mujoco", "flygym-gymnasium"]
# The optic lobe (flyvis, with its pretrained models), recognition and plots.
lab = ["flyvis", "torch", "scikit-learn", "matplotlib"]
dev = ["pytest", "pytest-xdist", "ruff"]

[project.scripts]
flylab = "wingloop.lab.cli:main"

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# An HTML template: its lines are the page's, not Python's.
"wingloop/lab/report.py" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "slow: needs a built body or a connectome",
    "sweep: a multi-flight measurement that pins a documented table; run with -m sweep",
]
# The sweeps re-measure tables that already live in README and LITERATURE.
# They are the discriminators that catch a false optimum, and they are worth
# running whenever the stroke or the loop changes -- not on every edit.
addopts = "-m 'not sweep'"
